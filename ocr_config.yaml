input: 'image_paths.csv'     # CSV with a path column, or a .txt with one path per line
path_column: 'file_path'
root: ''                     # prepended to each path when loading; the output keeps the paths as given
output: 'ocr_results.csv'
batch_size: 8
num_workers: 1               # parallel OCR processes, each loads its own model
threads_per_worker: 1        # torch CPU threads in each OCR process; a run uses num_workers x this many CPUs
save_every: 100              # append to the output CSV every N batches
save_text: false             # include the raw OCR text as a column
num_chunks: 1                # split the input into N chunks for array jobs; pick one with --chunk-index

# Set any field to false to skip it
fields:
  lengths: true
  acquisition_protocol: true
  frequency: true
  gain: true
  zoom: true
  depth: true
